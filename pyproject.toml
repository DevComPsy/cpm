[build-system]
requires = [
  "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "cpm-toolbox"
dynamic = ["version"]
description = "A fundamental scientific toolbox for computational psychiatry and psychology."
readme = "README.md"
authors = [
    { name = "Lenard Dome" },
    { name = "Frank Hezemans" },
    { name = "Ben J. Wagner" },
    { name = "Andrew Webb" },
    { name = "Marc Carrera" },
    { name = "Tobias Hauser" }
]
maintainers = [
    { name = "Lenard Dome", email = "lenarddome@gmail.com" }
]
license = { text = "AGPLv3" }
requires-python = ">3.11.0"
keywords = ["cpm-toolbox", "cpm", "computational-psychiatry", "computational-psychology", "psychometrics", "psychology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: PyPy"
]
dependencies = [
    "numpy>=2.0.0",
    "SciPy>=1.16.0",
    "pandas>=2.1.4",
    "multiprocess>=0.70.16",
    "ipyparallel>=8.8.0",
    "numdifftools>=0.9.41",
    "pybads>=1.0.4",
    "gpyreg>=1.2.1", # see 7ced733
    "dill>=0.3.8",
    "matplotlib>=3.8.0"
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.2",
    "pydata-sphinx-theme>=0.16",
    "myst-nb>=1.2",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "numpydoc>=1.8",
    "sphinx-codeautolink>=0.17",
    "sphinx-reredirects>=0.1.5",
    "sphinx-sitemap>=2.6",
    "sphinx-notfound-page>=1.0",
    "sphinx-autobuild>=2024.10",
    "ipykernel",
    "matplotlib>=3.8",
]
notebooks = [
    "ipykernel",
    "nbconvert>=7",
    "nbmake>=1.5",
    "pytest-xdist",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://cpm-toolbox.net"
Documentation = "https://devcompsy.github.io/cpm/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "cpm.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["cpm", "cpm.*"]

[tool.setuptools.package-data]
cpm = ["**/*.csv"]
